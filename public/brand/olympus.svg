<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Olympus">
  <defs>
    <filter id="glow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="2.4" result="b1"/>
      <feGaussianBlur stdDeviation="6" result="b2"/>
      <feGaussianBlur stdDeviation="13" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g fill="none" stroke="#00F4F6" stroke-linecap="round" stroke-linejoin="round"
     filter="url(#glow)">
    <!-- summit = the temple roof; the mountain flanks fall from its footing -->
    <path d="M128 36 L182 98 L182 152 L226 210 L30 210 L74 152 L74 98 Z" stroke-width="8"/>

    <!-- architrave and stylobate: the horizontals that make it a temple -->
    <path d="M74 98 L182 98" stroke-width="7"/>
    <path d="M74 152 L182 152" stroke-width="7"/>

    <!-- columns -->
    <path d="M95 104 L95 146 M116 104 L116 146 M140 104 L140 146 M161 104 L161 146"
          stroke-width="5"/>

    <!-- terraces: spans reach the flanks, so they read as the mountain's
         contour rather than floating dashes -->
    <path d="M62 176 L194 176" stroke-width="4" opacity="0.42"/>
    <path d="M48 194 L208 194" stroke-width="4" opacity="0.26"/>
  </g>
</svg>
