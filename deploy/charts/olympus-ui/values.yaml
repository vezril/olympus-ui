replicaCount: 1

image:
  # NOTE: the Docker Hub account is `calvinference`, NOT the GitHub org.
  repository: calvinference/olympusui
  pullPolicy: IfNotPresent
  # defaults to .Chart.AppVersion when empty
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  # Safe defaults: nothing is exposed until someone opts in.
  enabled: false
  # Load-bearing empty string: no IngressClass resource exists on this cluster and
  # k3s's Traefik v2.4 ignores named classes. The template OMITS the field entirely
  # when this is empty — an empty-string ingressClassName is RFC-1123-invalid and
  # k8s rejects the whole object.
  className: ""
  annotations: {}
  hosts:
    - host: olympus.home.experimentalneutron.com
      paths:
        - path: /
          pathType: Prefix
  # No cert-manager on this cluster — leave both empty unless one exists.
  clusterIssuer: ""
  tlsSecretName: ""

# olympus-service owns the registry and the health fan-out; this app's BFF is a
# proxy to it. RUNTIME env, safe to set from chart values. Never put NEXT_PUBLIC_*
# here — it is inlined at image build time and ignored at runtime.
olympusService:
  url: http://olympus-service.olympus.svc.cluster.local
  # How long the BFF waits on the service before giving up and saying so.
  timeoutMs: 4000

# Any additional runtime env, as name/value pairs.
extraEnv: []

resources:
  requests:
    cpu: 25m
    memory: 96Mi
  limits:
    memory: 256Mi

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
