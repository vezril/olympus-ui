# REFERENCE ONLY. The authoritative record of what is deployed lives in codex
# `apps/olympus/` (there is no Flux on this cluster; deploys are a manual
# `helm upgrade` from the tagged chart). Keep this in step with that, or delete it
# rather than let it drift into a second, wrong source of truth.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: olympus-ui
  namespace: olympus
spec:
  interval: 10m
  url: https://github.com/vezril/olympus-ui
  ref:
    # Pin to a release tag, never a branch. The pin records what is DEPLOYED.
    tag: v0.1.2
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: olympus-ui
  namespace: olympus
spec:
  interval: 10m
  chart:
    spec:
      chart: deploy/charts/olympus-ui
      sourceRef:
        kind: GitRepository
        name: olympus-ui
        namespace: olympus
  values:
    image:
      repository: calvinference/olympusui
      tag: "0.1.2"

    ingress:
      enabled: true
      # Load-bearing empty string — see values.yaml. Traefik answers on NodePort 61642.
      className: ""
      hosts:
        # Deployed host. The design note's olympus.home.experimentalneutron.com is
        # phase 1 of the access-gateway plan and does NOT resolve yet — the tailnet
        # split-DNS route is decided but blocked on mimir advertising 192.168.1.0/24.
        # Add it as a second host once that lands.
        - host: olympus.tailscale
          paths:
            - path: /
              pathType: Prefix

    olympusService:
      url: http://olympus-service.olympus.svc.cluster.local
      timeoutMs: 4000
