# Reference manifests mirroring the codex `apps/olympus/` shape.
# NOTE: there is no Flux on this cluster (k3s 1.21 — deliberately deferred).
# These exist so the codex side has a canonical source to mirror; the actual
# deploy today is a manual `helm upgrade -f <mirrored-values>` from the TAGGED
# chart. Never a bare `--set` upgrade: it replaces all user-supplied values and
# has silently deleted a live ingress before.
apiVersion: v1
kind: Namespace
metadata:
  name: olympus
